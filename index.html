.badge-id{background:#dbeafe;color:#1d4ed8}
.badge-easy{background:#d1fae5;color:#065f46}
.badge-medium{background:#fef3c7;color:#92400e}

.section-tabs{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap}
.sec-tab{padding:10px 20px;border:2px solid #e2e8f0;background:#fff;border-radius:10px;font-weight:600;font-size:0.85rem;cursor:pointer;transition:all 0.2s;color:#64748b}
.sec-tab.active{border-color:#2563eb;background:#eff6ff;color:#2563eb}

.content-section{display:none}
.content-section.visible{display:block;animation:fadeIn 0.3s ease}

.card-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}

.content-card{background:#fff;border-radius:14px;padding:24px;box-shadow:0 1px 4px rgba(0,0,0,0.06);border:1px solid #e2e8f0}

.result-box{background:#f8fafc;border:1px solid #e2e8f0;border-radius:10px;padding:16px;font-size:0.85rem;line-height:1.7;color:#475569;white-space:pre-wrap;word-break:break-word;min-height:120px}
.img-wrap{border-radius:12px;overflow:hidden;background:#f1f5f9;border:1px solid #e2e8f0}
.img-wrap img{width:100%;height:280px;object-fit:cover;display:block}
.img-desc{padding:14px;background:#faf5ff;border-top:1px solid #ede9fe;font-size:0.82rem;color:#5b21b6;line-height:1.6;font-style:italic}

.back-btn{padding:10px 20px;background:#f1f5f9;border:1px solid #e2e8f0;border-radius:8px;font-weight:600;font-size:0.85rem;cursor:pointer;color:#475569;margin-bottom:20px;transition:all 0.2s}
.back-btn:hover{background:#e2e8f0;color:#1e293b}

/* Comparison Table */
.comparison-table{background:#fff;border-radius:16px;padding:24px;box-shadow:0 1px 4px rgba(0,0,0,0.06);border:1px solid #e2e8f0;overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:0.82rem}

td{padding:11px 10px;border-bottom:1px solid #f1f5f9;vertical-align:top;line-height:1.5}

.diff-badge{padding:2px 8px;border-radius:12px;font-size:0.72rem;font-weight:600;white-space:nowrap}

  imgPromptEn:"Split illustration: left panel shows a cold dark chaotic bedroom with stressed person awake, right panel shows the same person peacefully sleeping under warm moonlight. A glowing app screen on the nightstand symbolizes the 5-minute miracle.",
  imgPromptKo:"[Problem] \ubd88\uba74\uc99d\uc5d0 \uc2dc\ub2ec\ub9ac\ub294 \uc9c1\uc7a5\uc778\n[Agitate] \uc5b4\ub461\uace0 \ucc28\uac00\uc6b4 \ud63c\ub3c8\uc758 \uce68\uc2e4\n[Solution] \ub530\ub73b\ud55c \ub2ec\ube5b \uc544\ub798 \ud3c9\uc628\ud558\uac8c \uc7a0\ub4e0 \ubd84\ud560 \uc77c\ub7ec\uc2a4\ud2b8",

  codeResult:"def login(username: str, password: str) -> dict:\n    \"\"\"\uba85\ud655\ud55c \uc5d0\ub7ec \uba54\uc2dc\uc9c0\ub97c \ud3ec\ud568\ud55c \ub85c\uadf8\uc778 \ud568\uc218\"\"\"\n    user = db.get_user(username)\n\n    if not user:\n        return {'success': False, 'error': 'USER_NOT_FOUND',\n                'message': '\ub4f1\ub85d\ub418\uc9c0 \uc54a\uc740 \uc774\uba54\uc77c\uc785\ub2c8\ub2e4. \ud68c\uc6d0\uac00\uc785\uc744 \uc9c4\ud589\ud574\uc8fc\uc138\uc694.'}\n\n    if not user.is_active:\n        return {'success': False, 'error': 'ACCOUNT_DISABLED',\n                'message': '\ube44\ud65c\uc131\ud654\ub41c \uacc4\uc815\uc785\ub2c8\ub2e4. \uace0\uac1d\uc13c\ud130(1234-5678)\ub85c \ubb38\uc758\ud574\uc8fc\uc138\uc694.'}\n\n    if not verify_password(password, user.hashed_password):\n        remaining = 5 - user.failed_attempts\n        return {'success': False, 'error': 'WRONG_PASSWORD',\n                'message': f'\ube44\ubc00\ubc88\ud638\uac00 \ud2c0\ub838\uc2b5\ub2c8\ub2e4. {remaining}\ud68c \ub354 \uc2e4\ud328 \uc2dc \uacc4\uc815\uc774 \uc7a0\uae41\ub2c8\ub2e4.'}\n\n    return {'success': True, 'token': generate_jwt(user.id), 'user': user.to_dict()}",

  docPrompt:"[Context] \uc800\ub294 \ud604\uc7ac \uc911\uc694\ud55c \ud504\ub85c\uc81d\ud2b8\uc758 \ub9c8\uac10 \uae30\ud55c \uc5f0\uc7a5\uc744 \uc694\uccad\ud574\uc57c \ud558\ub294 \uc0c1\ud669\uc785\ub2c8\ub2e4.\n\ud504\ub85c\uc81d\ud2b8\ub294 75% \uc644\ub8cc\ub418\uc5c8\uace0, \uc608\uc0c1\uce58 \ubabb\ud55c \uae30\uc220\uc801 \uc774\uc288\uac00 \ubc1c\uc0dd\ud588\uc2b5\ub2c8\ub2e4.\n[Action] \uc0c1\uc0ac\uc5d0\uac8c \ubcf4\ub0b4\ub294 \uc815\uc911\ud558\uace0 \uc124\ub4dd\ub825 \uc788\ub294 \uc774\uba54\uc77c\uc744 \uc791\uc131\ud558\uc138\uc694.\n[Result] \uc0c1\uc0ac\uac00 3\uc77c \uc5f0\uc7a5\uc744 \uc2b9\uc778\ud558\ub3c4\ub85d \uc124\ub4dd\ud558\ub294 \uac83\uc774 \ubaa9\ud45c\uc785\ub2c8\ub2e4.\n[Example] \uc804\ubb38\uc801\uc774\uace0 \ucc45\uc784\uac10 \uc788\ub294 \uc5b4\uc870\ub85c, \ubb38\uc81c \uc6d0\uc778\uacfc \ud574\uacb0 \uacc4\ud68d\uc744 \ud3ec\ud568\ud558\uc138\uc694.",

  imgPromptKo:"[Context] \uc911\uc694\ud55c \uc5c5\ubb34 \uc774\uba54\uc77c\uc744 \uc791\uc131\ud558\ub294 \uc9c1\uc7a5\uc778\n[Action] \ub530\ub73b\ud55c \uc0ac\ubb34\uc2e4 \uc870\uba85, \ub178\ud2b8\ubd81\uc5d0 \uc9d1\uc911\ud558\ub294 \uc778\ubb3c\n[Result] \ubcf4\ucf00 \ubc30\uacbd\uc758 \ud3ec\ud1a0\ub9ac\uc5bc\ub9ac\uc2a4\ud2f1 \ube44\uc988\ub2c8\uc2a4 \uc0ac\uc9c4",

  codeResult:"import psycopg2\nfrom contextlib import contextmanager\n\n@contextmanager\ndef get_db_connection():\n    conn = psycopg2.connect(DATABASE_URL)\n    try:\n        yield conn\n    finally:\n        conn.close()\n\n# \ucde8\uc57d\ud55c \ucf54\ub4dc (SQL Injection \uc704\ud5d8)\n# query = f\"SELECT * FROM users WHERE email = '{email}'\"\n\n# \uc548\uc804\ud55c \ucf54\ub4dc (\ud30c\ub77c\ubbf8\ud130 \ubc14\uc778\ub529)\ndef get_user_by_email(email: str) -> dict:\n    \"\"\"OWASP \uac00\uc774\ub4dc\ub77c\uc778 \uc900\uc218 - \ud30c\ub77c\ubbf8\ud130 \ubc14\uc778\ub529 \uc0ac\uc6a9\"\"\"\n    query = \"SELECT id, name, email FROM users WHERE email = %s AND is_active = %s\"\n    with get_db_connection() as conn:\n        with conn.cursor() as cur:\n            cur.execute(query, (email, True))  # \ud30c\ub77c\ubbf8\ud130\ub294 \ud29c\ud50c\ub85c \uc804\ub2ec\n            row = cur.fetchone()\n            return {'id': row[0], 'name': row[1], 'email': row[2]} if row else None",

  imgDesc:"\ube5b\ub098\ub294 \ub514\uc9c0\ud138 \uccb4\uc2a4\ud310\uc744 \uc704\uc5d0\uc11c \ub0b4\ub824\ub2e4\ubcf8 \uad6c\ub3c4. \ud669\uae08\uc0c9 \ud0b9\uc774 \ub098\uba38\uc9c0 \uc740\uc0c9\u00b7\ud770\uc0c9 \ub9d0\ub4e4\ubcf4\ub2e4 \ub192\uac8c \uc19f\uc544 \uc788\uc5b4 \uacbd\uc7c1 \uc6b0\uc704\ub97c \uc0c1\uc9d5. \ud30c\ub780 \uc570\ube44\uc5b8\ud2b8 \uc870\uba85\uacfc \ubcf4\ucf00 \ubc30\uacbd\uc774 \uace0\uae09\uc2a4\ub7ec\uc6b4 \uc804\ub7b5\uc801 \ubd84\uc704\uae30\ub97c \uc5f0\ucd9c.",

  codeResult:"import re\nfrom collections import Counter\nfrom pathlib import Path\n\ndef analyze_log_errors(log_path: str, top_n: int = 10):\n    \"\"\"\ub300\uc6a9\ub7c9 \ub85c\uadf8 \ud30c\uc77c \uc2a4\ud2b8\ub9ac\ubc0d \ubd84\uc11d\"\"\"\n    pattern = re.compile(r'(ERROR|WARN|INFO).*?:\\s+(.+?)$', re.MULTILINE)\n    error_counter = Counter()\n\n    # \uc2a4\ud2b8\ub9ac\ubc0d \uc77d\uae30\ub85c \uba54\ubaa8\ub9ac \ud6a8\uc728 \ud655\ubcf4\n    with open(log_path, 'r', encoding='utf-8') as f:\n        for line in f:\n            match = pattern.search(line)\n            if match:\n                level, message = match.group(1), match.group(2)\n                if level == 'ERROR':\n                    # \uba54\uc2dc\uc9c0 \uc815\uaddc\ud654 (\uc22b\uc790 ID \uc81c\uac70)\n                    normalized = re.sub(r'\\d+', 'N', message[:100])\n                    error_counter[normalized] += 1\n\n    print(f\"\\n\uc0c1\uc704 {top_n}\uac1c \uc5d0\ub7ec \ud328\ud134:\")\n    for pattern_str, count in error_counter.most_common(top_n):\n        print(f\"  [{count:5d}\ud68c] {pattern_str}\")\n\nanalyze_log_errors(\"app.log\", top_n=10)",

  codePrompt:"[Attention] \uc774\uba54\uc77c \ub9c8\ucf00\ud305 \uc790\ub3d9\ud654 \uc2dc\uc2a4\ud15c\uc774 \ud544\uc694\ud569\ub2c8\ub2e4\n[Interest] \uc0ac\uc6a9\uc790 \ud589\ub3d9 \uae30\ubc18\uc73c\ub85c \uac1c\uc778\ud654 \uc774\uba54\uc77c\uc744 \uc790\ub3d9 \ubc1c\uc1a1\ud558\ub294 \uae30\ub2a5\n[Desire] \ubc1c\uc1a1\ub960\u00b7\uc624\ud508\uc728\u00b7\ud074\ub9ad\ub960\uc744 \ucd94\uc801\ud558\ub294 A/B \ud14c\uc2a4\ud2b8 \uae30\ub2a5\uae4c\uc9c0 \ud3ec\ud568\n[Action] Python\uc73c\ub85c \uae30\ubcf8 EmailAutomation \ud074\ub798\uc2a4\ub97c \uc791\uc131\ud574\uc8fc\uc138\uc694",
  codeResult:"from dataclasses import dataclass\nfrom datetime import datetime\nimport random\n\n@dataclass\nclass EmailCampaign:\n    name: str\n    subject_a: str\n    subject_b: str\n    body_a: str\n    body_b: str\n\nclass EmailAutomation:\n    def __init__(self):\n        self.campaigns = {}\n        self.metrics = {}\n\n    def send_personalized(self, user_id: str, trigger: str, campaign: EmailCampaign):\n        \"\"\"\uc0ac\uc6a9\uc790 \ud2b8\ub9ac\uac70 \uae30\ubc18 \uac1c\uc778\ud654 \uc774\uba54\uc77c \ubc1c\uc1a1\"\"\"\n        # A/B \ud14c\uc2a4\ud2b8: 50/50 \ub79c\ub364 \ubd84\ubc30\n        variant = 'A' if random.random() < 0.5 else 'B'\n        subject = campaign.subject_a if variant == 'A' else campaign.subject_b\n\n        # \ubc1c\uc1a1 \uae30\ub85d\n        self.metrics[user_id] = {\n            'sent_at': datetime.now().isoformat(),\n            'trigger': trigger,\n            'variant': variant,\n            'opened': False,\n            'clicked': False\n        }\n        print(f\"\u2713 [{variant}] {user_id}\uc5d0\uac8c \ubc1c\uc1a1: {subject}\")\n        return variant\n\n    def get_ab_results(self, campaign_name: str) -> dict:\n        \"\"\"A/B \ud14c\uc2a4\ud2b8 \uacb0\uacfc \ubd84\uc11d\"\"\"\n        a_opens = sum(1 for m in self.metrics.values()\n                     if m['variant'] == 'A' and m['opened'])\n        b_opens = sum(1 for m in self.metrics.values()\n                     if m['variant'] == 'B' and m['opened'])\n        return {'variant_a_open_rate': a_opens, 'variant_b_open_rate': b_opens}",

  imgDesc:"\uc67c\ucabd \ud328\ub110\uc740 \ucc28\uac11\uace0 \uc9c0\uce5c \uc57c\uadfc \uc7a5\uba74, \uc624\ub978\ucabd\uc740 \ub530\ub73b\ud55c \uace8\ub4e0\uc544\uc6cc \uc57c\uc678 \uc7a5\uba74\uc73c\ub85c \uadf9\uc801 \ub300\ube44\ub97c \ud615\uc131. \uac00\uc6b4\ub370 \uc5f0\uacb0 \ud328\ub110\uc758 \uc544\uc774\ucf58\ub4e4\uc774 \ub450 \uc138\uacc4\ub97c \uc787\ub294 \ube0c\ub9bf\uc9c0 \uc5ed\ud560\uc744 \uc2dc\uac01\uc801\uc73c\ub85c \ud45c\ud604\ud55c \uc5d0\ub514\ud1a0\ub9ac\uc5bc \uc77c\ub7ec\uc2a4\ud2b8.",
  codePrompt:"[Before] \uc911\ucca9\ub41c for\ubb38\uc73c\ub85c O(n\u00b2) \ubcf5\uc7a1\ub3c4\ub97c \uac00\uc9c4 \ube44\ud6a8\uc728\uc801\uc778 \ub450 \ubc30\uc5f4 \uad50\uc9d1\ud569 \ucf54\ub4dc\n[After] \ud574\uc2dc\uc14b\uc744 \ud65c\uc6a9\ud558\uc5ec O(n)\uc73c\ub85c \ucd5c\uc801\ud654\ub41c \ucf54\ub4dc\n[Bridge] \uc65c set()\uc774 \ube60\ub978\uc9c0 \uc6d0\ub9ac\ub97c \uc8fc\uc11d\uc73c\ub85c \uc124\uba85\ud558\uba74\uc11c \ub9ac\ud329\ud130\ub9c1\ud558\uc138\uc694",
  codeResult:"# BEFORE: O(n\u00b2) \ube44\ud6a8\uc728\uc801\uc778 \ucf54\ub4dc\ndef intersection_slow(arr1, arr2):\n    result = []\n    for item in arr1:          # O(n)\n        if item in arr2:       # O(n) - \ub9ac\uc2a4\ud2b8 \uc120\ud615 \ud0d0\uc0c9\n            result.append(item)\n    return result  # \ucd1d O(n\u00b2)\n\n# BRIDGE: set\uc740 \ud574\uc2dc \ud14c\uc774\ube14 \uae30\ubc18 \u2192 \ud0d0\uc0c9\uc774 O(1)\n# \ub9ac\uc2a4\ud2b8\uc758 'in' \uc5f0\uc0b0: O(n) vs \uc138\ud2b8\uc758 'in' \uc5f0\uc0b0: O(1)\n\n# AFTER: O(n) \ucd5c\uc801\ud654\ub41c \ucf54\ub4dc\ndef intersection_fast(arr1, arr2):\n    \"\"\"\ud574\uc2dc\uc14b\uc744 \ud65c\uc6a9\ud55c O(n) \uad50\uc9d1\ud569\"\"\"\n    set2 = set(arr2)           # O(n) \ud574\uc2dc \ud14c\uc774\ube14 \uc0dd\uc131\n    return [x for x in arr1 if x in set2]  # O(n) \u00d7 O(1) = O(n)\n\n# \uc131\ub2a5 \ube44\uad50\nimport time\nlarge1 = list(range(10000))\nlarge2 = list(range(5000, 15000))\n\nstart = time.time(); intersection_slow(large1, large2); slow_time = time.time() - start\nstart = time.time(); intersection_fast(large1, large2); fast_time = time.time() - start\nprint(f\"\ub290\ub9b0 \ubc29\ubc95: {slow_time:.4f}s | \ube60\ub978 \ubc29\ubc95: {fast_time:.4f}s | \uc18d\ub3c4 \ud5a5\uc0c1: {slow_time/fast_time:.1f}x\")",

  codeResult:"import tracemalloc\nimport time\nfrom collections import defaultdict\n\n# SITUATION: \uba54\ubaa8\ub9ac \ub204\uc218 \ud0d0\uc9c0 \ubc0f \uc218\uc815\n\n# \ub204\uc218\uac00 \uc788\ub294 \ucf54\ub4dc (\uc804\uc5ed \uce90\uc2dc\uac00 \ubb34\ud55c \uc99d\uac00)\n_cache = {}  # \ubb38\uc81c: \ub9cc\ub8cc \uc5c6\ub294 \ubb34\ud55c \uce90\uc2dc\n\ndef get_data_leak(key):\n    if key not in _cache:\n        _cache[key] = expensive_operation(key)  # \uba54\ubaa8\ub9ac \ub204\uc218!\n    return _cache[key]\n\n# ACTION: tracemalloc\uc73c\ub85c \ud504\ub85c\ud30c\uc77c\ub9c1\ntracemalloc.start()\nsnapshot1 = tracemalloc.take_snapshot()\n\n# \uc218\uc815\ub41c \ucf54\ub4dc: LRU \uce90\uc2dc \uc0ac\uc6a9\nfrom functools import lru_cache\n\n@lru_cache(maxsize=1000)  # \ucd5c\ub300 1000\uac1c\ub9cc \uc720\uc9c0\ndef get_data_fixed(key):\n    return expensive_operation(key)\n\nsnapshot2 = tracemalloc.take_snapshot()\nstats = snapshot2.compare_to(snapshot1, 'lineno')\nprint(\"\uba54\ubaa8\ub9ac \uc99d\uac00 Top 3:\")\nfor stat in stats[:3]:\n    print(f\"  {stat}\")",

  codePrompt:"[Context] FastAPI \uae30\ubc18 REST API \uc11c\ubc84\ub97c \uac1c\ubc1c \uc911\uc785\ub2c8\ub2e4\n[Objective] JWT \ud1a0\ud070 \uae30\ubc18 \uc0ac\uc6a9\uc790 \uc778\uc99d \ubbf8\ub4e4\uc6e8\uc5b4\ub97c \uad6c\ud604\ud558\uc138\uc694\n[Style] Clean Architecture \ud328\ud134, \uc758\uc874\uc131 \uc8fc\uc785 \uc0ac\uc6a9\n[Tone] \ud504\ub85c\ub355\uc158 \ub808\ubca8 \ucf54\ub4dc \ud488\uc9c8\n[Audience] \uc2dc\ub2c8\uc5b4 \uac1c\ubc1c\uc790 \ucf54\ub4dc \ub9ac\ubdf0 \uae30\uc900 \ucda9\uc871\n[Response] \ubbf8\ub4e4\uc6e8\uc5b4 \ud074\ub798\uc2a4 + FastAPI \uc801\uc6a9 \uc608\uc2dc \ucf54\ub4dc",
  codeResult:"from fastapi import Request, HTTPException, status\nfrom fastapi.security import HTTPBearer, HTTPAuthorizationCredentials\nimport jwt\n\nsecurity = HTTPBearer()\n\nclass JWTAuthMiddleware:\n    \"\"\"Clean Architecture \uae30\ubc18 JWT \uc778\uc99d \ubbf8\ub4e4\uc6e8\uc5b4\"\"\"\n\n    def __init__(self, secret_key: str, algorithm: str = \"HS256\"):\n        self.secret_key = secret_key\n        self.algorithm = algorithm\n\n    def verify_token(self, token: str) -> dict:\n        try:\n            payload = jwt.decode(token, self.secret_key, algorithms=[self.algorithm])\n            return payload\n        except jwt.ExpiredSignatureError:\n            raise HTTPException(\n                status_code=status.HTTP_401_UNAUTHORIZED,\n                detail=\"\ud1a0\ud070\uc774 \ub9cc\ub8cc\ub418\uc5c8\uc2b5\ub2c8\ub2e4.\",\n                headers={\"WWW-Authenticate\": \"Bearer\"}\n            )\n        except jwt.InvalidTokenError:\n            raise HTTPException(\n                status_code=status.HTTP_401_UNAUTHORIZED,\n                detail=\"\uc720\ud6a8\ud558\uc9c0 \uc54a\uc740 \ud1a0\ud070\uc785\ub2c8\ub2e4.\"\n            )\n\n# FastAPI \uc801\uc6a9\nfrom fastapi import FastAPI, Depends\n\napp = FastAPI()\nauth = JWTAuthMiddleware(secret_key=\"your-secret-key\")\n\nasync def get_current_user(credentials: HTTPAuthorizationCredentials = Depends(security)):\n    return auth.verify_token(credentials.credentials)\n\n@app.get(\"/protected\")\nasync def protected_route(user: dict = Depends(get_current_user)):\n    return {\"user_id\": user[\"sub\"], \"message\": \"\uc778\uc99d \uc131\uacf5\"}",

  docPrompt:"[Role] \ub2f9\uc2e0\uc740 UX \ub9ac\uc11c\uce58 \uc804\ubb38\uac00\uc785\ub2c8\ub2e4.\n[Input] \uc2e4\uc81c \uc0ac\uc6a9\uc790 \uc778\ud130\ubdf0 \ubc1c\ucdcc\ub85d\n[Steps]\n1. \ubd88\ud3b8\ud568 \ucd94\ucd9c \u2192 2. \uce74\ud14c\uace0\ub9ac \ubd84\ub958 \u2192 3. \uc6b0\uc120\uc21c\uc704 \uc815\ub82c \u2192 4. \uac1c\uc120 \ubc29\uc548 \uc81c\uc548\n[Expectation] \ud575\uc2ec \uc778\uc0ac\uc774\ud2b8 3\uac1c + \uac1c\uc120 \uc81c\uc548 3\uac1c\n[Novelty] \ud45c\uba74\uc801 \ubd88\ub9cc \ub108\uba38\uc758 \uc228\uaca8\uc9c4 \ub2c8\uc988\ub97c \ubc1c\uad74\ud558\uc138\uc694",

  imgPromptKo:"[Role] UX \ube44\ud3ec\uc560\ud504\ud130 \uc77c\ub7ec\uc2a4\ud2b8\ub808\uc774\ud130\n[Instructions] \ud30c\uc2a4\ud154 \ud50c\ub7ab \uc2a4\ud0c0\uc77c\ub85c \ub450 \ud328\ub110 \ub300\ube44\n[Steps] \uc88c: \ubcf5\uc7a1\ud55c \uc571\uacfc \ucc21\uadf8\ub9b0 \uc0ac\uc6a9\uc790 / \uc6b0: \ubbf8\ub2c8\uba40 UI\uc640 \uc6c3\ub294 \uc0ac\uc6a9\uc790\n[End-goal] UX \uac1c\uc120 \uba54\uc2dc\uc9c0\ub97c \uc9c1\uad00\uc801\uc73c\ub85c \uc804\ub2ec",

  codePrompt:"[Role] \uc2dc\ub2c8\uc5b4 \ub370\uc774\ud130 \uc5d4\uc9c0\ub2c8\uc5b4\n[Input] \uc77c 100GB \uaddc\ubaa8\uc758 \uc0ac\uc6a9\uc790 \ud589\ub3d9 \ub85c\uadf8 (JSONL \ud615\uc2dd)\n[Steps] \uc2a4\ud2b8\ub9ac\ubc0d \ud30c\uc2f1 \u2192 \uc138\uc158 \ub2e8\uc704 \uc9d1\uacc4 \u2192 \uc774\uc0c1\uce58 \uc81c\uac70 \u2192 Parquet \uc800\uc7a5\n[Expectation] \uba54\ubaa8\ub9ac 1GB \uc774\ud558\ub85c \ucc98\ub9ac \uac00\ub2a5\ud55c \ud30c\uc774\ud504\ub77c\uc778\n[Novelty] \ucc98\ub9ac \uc911 \uc2e4\ud328 \uc2dc \uccb4\ud06c\ud3ec\uc778\ud2b8\ub85c \uc7ac\uc2dc\uc791 \uac00\ub2a5\ud55c \uc124\uacc4",
  codeResult:"import json\nimport pyarrow as pa\nimport pyarrow.parquet as pq\nfrom pathlib import Path\nfrom collections import defaultdict\n\nclass CheckpointedPipeline:\n    \"\"\"\uccb4\ud06c\ud3ec\uc778\ud2b8 \uae30\ubc18 \ub300\uc6a9\ub7c9 \ub85c\uadf8 \ucc98\ub9ac \ud30c\uc774\ud504\ub77c\uc778\"\"\"\n\n    def __init__(self, checkpoint_file: str = \"checkpoint.json\"):\n        self.checkpoint_file = checkpoint_file\n        self.processed_lines = self._load_checkpoint()\n\n    def _load_checkpoint(self) -> int:\n        if Path(self.checkpoint_file).exists():\n            with open(self.checkpoint_file) as f:\n                return json.load(f).get('processed_lines', 0)\n        return 0\n\n    def _save_checkpoint(self, line_num: int):\n        with open(self.checkpoint_file, 'w') as f:\n            json.dump({'processed_lines': line_num}, f)\n\n    def process_streaming(self, input_path: str, output_path: str, batch_size: int = 10000):\n        \"\"\"\uc2a4\ud2b8\ub9ac\ubc0d \ubc29\uc2dd\uc73c\ub85c \ub300\uc6a9\ub7c9 \ud30c\uc77c \ucc98\ub9ac (\uba54\ubaa8\ub9ac 1GB \uc774\ud558)\"\"\"\n        sessions = defaultdict(list)\n        batch = []\n\n        with open(input_path, 'r') as f:\n            for i, line in enumerate(f):\n                if i < self.processed_lines:\n                    continue  # \uccb4\ud06c\ud3ec\uc778\ud2b8 \uc774\ud6c4\ubd80\ud130 \uc7ac\uc2dc\uc791\n\n                try:\n                    event = json.loads(line)\n                    sessions[event['session_id']].append(event)\n                    batch.append(event)\n\n                    if len(batch) >= batch_size:\n                        self._write_parquet_batch(batch, output_path, i)\n                        batch.clear()\n                        self._save_checkpoint(i)\n                        print(f\"\ucc98\ub9ac \uc644\ub8cc: {i:,}\uc904\")\n\n                except (json.JSONDecodeError, KeyError):\n                    continue  # \uc774\uc0c1\uce58 \uc81c\uac70\n\n        if batch:\n            self._write_parquet_batch(batch, output_path, 'final')",

  codeResult:"# GROW \ud504\ub808\uc784\uc6cc\ud06c \uc801\uc6a9: \ub9c8\uc774\ud06c\ub85c\uc11c\ube44\uc2a4 \ub9c8\uc774\uadf8\ub808\uc774\uc158\n# \uc804\ub7b5: Strangler Fig \ud328\ud134\uc73c\ub85c \uc778\uc99d \uc11c\ube44\uc2a4 \ubd84\ub9ac\n\n# \uc0c8\ub85c\uc6b4 \ub3c5\ub9bd \uc778\uc99d \ub9c8\uc774\ud06c\ub85c\uc11c\ube44\uc2a4 (FastAPI)\nfrom fastapi import FastAPI\nimport httpx\n\nauth_service = FastAPI(title=\"Auth Microservice\")\n\n@auth_service.post(\"/auth/login\")\nasync def microservice_login(credentials: dict):\n    \"\"\"\uae30\uc874 Django \ub85c\uc9c1\uc5d0\uc11c \ubd84\ub9ac\ub41c \ub3c5\ub9bd \uc778\uc99d \uc11c\ube44\uc2a4\"\"\"\n    # \uc778\uc99d \ub85c\uc9c1 (\uae30\uc874 Django\uc5d0\uc11c \uc774\uad00)\n    user = await verify_credentials(credentials)\n    token = generate_jwt(user['id'])\n    return {\"token\": token, \"user_id\": user['id']}\n\n# Django \uc571\uc5d0\uc11c \uc0c8 \uc11c\ube44\uc2a4\ub85c \ub77c\uc6b0\ud305 (Strangler Fig)\nclass AuthServiceProxy:\n    \"\"\"\uc810\uc9c4\uc801 \ub9c8\uc774\uadf8\ub808\uc774\uc158: \uc0c8 \uc11c\ube44\uc2a4\ub85c \ud2b8\ub798\ud53d \uc804\ud658\"\"\"\n    AUTH_SERVICE_URL = \"http://auth-service:8001\"\n\n    async def login(self, username: str, password: str) -> dict:\n        async with httpx.AsyncClient() as client:\n            response = await client.post(\n                f\"{self.AUTH_SERVICE_URL}/auth/login\",\n                json={\"username\": username, \"password\": password},\n                timeout=5.0\n            )\n        return response.json()\n\n# \ub9c8\uc774\uadf8\ub808\uc774\uc158 \uc644\ub8cc \ud6c4 Django \uc778\uc99d \ubdf0\ub97c \ud504\ub85d\uc2dc\ub85c \uad50\uccb4\nauth_proxy = AuthServiceProxy()",

  codeResult:"# PREP: \ud0c0\uc785 \ud78c\ud2b8\uc758 \uc911\uc694\uc131\n\n# POINT: \ud0c0\uc785 \ud78c\ud2b8\uac00 \ucf54\ub4dc \ud488\uc9c8\uc744 \ub192\uc778\ub2e4\n\n# REASON 1: IDE \uc790\ub3d9\uc644\uc131\u00b7\uc5d0\ub7ec \uac10\uc9c0 \ud5a5\uc0c1\n# BEFORE (\ud0c0\uc785 \ud78c\ud2b8 \uc5c6\uc74c)\ndef process_data(data, threshold):\n    return [x for x in data if x > threshold]  # IDE\uac00 x\uc758 \ud0c0\uc785\uc744 \ubaa8\ub984\n\n# AFTER (\ud0c0\uc785 \ud78c\ud2b8 \uc788\uc74c)\nfrom typing import List\ndef process_data(data: List[float], threshold: float) -> List[float]:\n    return [x for x in data if x > threshold]  # IDE\uac00 \uc644\uc804\ud55c \ud0c0\uc785 \uc815\ubcf4 \uc81c\uacf5\n\n# REASON 2: \ub7f0\ud0c0\uc784 \uac80\uc99d (pydantic)\nfrom pydantic import BaseModel, validator\n\nclass UserInput(BaseModel):\n    name: str\n    age: int\n    email: str\n\n    @validator('age')\n    def age_must_be_positive(cls, v):\n        if v < 0:\n            raise ValueError('\ub098\uc774\ub294 \uc591\uc218\uc5ec\uc57c \ud569\ub2c8\ub2e4')\n        return v\n\n# EXAMPLE: \ud0c0\uc785 \uc5d0\ub7ec\ub97c \ucef4\ud30c\uc77c \ud0c0\uc784\uc5d0 \uc7a1\uae30\n# mypy\ub85c \uc2e4\ud589: mypy script.py\ndef greet(name: str) -> str:\n    return f\"Hello, {name}\"\n\nresult: int = greet(\"Alice\")  # mypy\uac00 \ud0c0\uc785 \ubd88\uc77c\uce58 \uacbd\uace0 \ubc1c\uc0dd!\n# error: Incompatible types in assignment (expression has type \"str\", variable has type \"int\")\n\n# POINT (\uc7ac\uac15\uc870): \ud0c0\uc785 \ud78c\ud2b8 + mypy = \ub7f0\ud0c0\uc784 \uc804 \ubc84\uadf8 90% \ucc28\ub2e8",

  codePrompt:"[Capacity] \uc2dc\uc2a4\ud15c \uc124\uacc4 \uc804\ubb38\uac00\n[Role] MLOps \uc544\ud0a4\ud14d\ud2b8\n[Insight] \ud604\uc7ac \ub2e8\uc21c \uc2a4\ud06c\ub9bd\ud2b8 \ubc29\uc2dd\uc758 ML \ud30c\uc774\ud504\ub77c\uc778 \ud55c\uacc4 \uc778\uc2dd\n[Statement] \ud504\ub85c\ub355\uc158 \ub808\ubca8 ML \ud30c\uc774\ud504\ub77c\uc778\uc744 \uc124\uacc4\ud558\uc138\uc694\n[Personality] \ud655\uc7a5\uc131\u00b7\uc7ac\ud604\uc131\u00b7\ubaa8\ub2c8\ud130\ub9c1\uc744 \ucd5c\uc6b0\uc120 \uace0\ub824\n[Experiment] \ucd5c\uc2e0 MLOps \ud328\ud134(Feature Store, Model Registry) \uc801\uc6a9",
  codeResult:"from dataclasses import dataclass\nfrom typing import Any\nimport mlflow\nimport mlflow.sklearn\nfrom sklearn.pipeline import Pipeline\n\n@dataclass\nclass ModelConfig:\n    name: str\n    version: str\n    features: list\n    hyperparams: dict\n\nclass MLOpsPipeline:\n    \"\"\"\ud504\ub85c\ub355\uc158 \ub808\ubca8 MLOps \ud30c\uc774\ud504\ub77c\uc778\"\"\"\n\n    def __init__(self, config: ModelConfig):\n        self.config = config\n        mlflow.set_tracking_uri(\"http://mlflow-server:5000\")\n\n    def train_with_tracking(self, X_train, y_train) -> str:\n        \"\"\"MLflow\ub85c \uc2e4\ud5d8 \ucd94\uc801 \ubc0f \ubaa8\ub378 \ub4f1\ub85d\"\"\"\n        with mlflow.start_run(run_name=f\"{self.config.name}_v{self.config.version}\"):\n            # \ud558\uc774\ud37c\ud30c\ub77c\ubbf8\ud130 \ub85c\uae45\n            mlflow.log_params(self.config.hyperparams)\n            mlflow.log_param(\"features\", self.config.features)\n\n            # \ubaa8\ub378 \ud559\uc2b5\n            model = self._build_pipeline()\n            model.fit(X_train, y_train)\n\n            # \uba54\ud2b8\ub9ad \ud3c9\uac00 \ubc0f \ub85c\uae45\n            metrics = self._evaluate(model, X_train, y_train)\n            mlflow.log_metrics(metrics)\n\n            # Model Registry\uc5d0 \ub4f1\ub85d\n            mlflow.sklearn.log_model(\n                model,\n                artifact_path=\"model\",\n                registered_model_name=self.config.name\n            )\n\n            run_id = mlflow.active_run().info.run_id\n            print(f\"\u2713 \ubaa8\ub378 \ub4f1\ub85d \uc644\ub8cc: {self.config.name} (run_id: {run_id})\")\n            return run_id\n\n    def _build_pipeline(self) -> Pipeline:\n        from sklearn.preprocessing import StandardScaler\n        from sklearn.ensemble import RandomForestClassifier\n        return Pipeline([\n            ('scaler', StandardScaler()),\n            ('model', RandomForestClassifier(**self.config.hyperparams))\n        ])",

  imgPromptKo:"[Task] \uc6d0\uaca9 \uadfc\ubb34 \ud658\uacbd \uc2dc\uac01\ud654\n[Requirements] \ub530\ub73b\ud55c \uc790\uc5f0\uad11\uc758 \ud648 \uc624\ud53c\uc2a4\n[Audience] \uc6d0\uaca9 \uadfc\ubb34\uc790\n[Context] \ud640\ub85c\uadf8\ub798\ud53d \ud611\uc5c5 \ub3c4\uad6c UI\uc640 \uc0dd\uc0b0\uc131 \ucc28\ud2b8\n[Examples] '\ud63c\uc790\uc9c0\ub9cc \uc5f0\uacb0\ub418\uc5b4 \uc788\ub2e4'\ub294 \uc6d0\uaca9 \uadfc\ubb34 \ud328\ub7ec\ub2e4\uc784",

  codePrompt:"[Task] \ubd84\uc0b0 \uc2dc\uc2a4\ud15c \ud5ec\uc2a4\uccb4\ud06c \ubaa8\ub2c8\ud130\ub9c1 \uad6c\ud604\n[Requirements] \ub2e4\uc911 \uc11c\ube44\uc2a4 \uc9c0\uc6d0, \uc54c\ub78c \uc784\uacc4\uac12 \uc124\uc815, \ud788\uc2a4\ud1a0\ub9ac \uc800\uc7a5\n[Audience] SRE \ud300 (Site Reliability Engineering)\n[Context] MSA \uc804\ud658 \ud6c4 \uc11c\ube44\uc2a4 \uc218 \uae09\uc99d\uc73c\ub85c \uc218\ub3d9 \ubaa8\ub2c8\ud130\ub9c1 \ud55c\uacc4\n[Examples] Prometheus/Grafana \ud328\ud134 \ucc38\uace0, PagerDuty \uc5f0\ub3d9 \uace0\ub824",
  codeResult:"import asyncio\nimport aiohttp\nfrom datetime import datetime\nfrom dataclasses import dataclass, field\nfrom typing import List, Optional\n\n@dataclass\nclass ServiceHealth:\n    name: str\n    url: str\n    threshold_ms: int = 500\n    history: List[dict] = field(default_factory=list)\n\nclass DistributedHealthChecker:\n    \"\"\"SRE\ud300\uc744 \uc704\ud55c \ubd84\uc0b0 \uc11c\ube44\uc2a4 \ud5ec\uc2a4\uccb4\ud06c \ubaa8\ub2c8\ud130\ub9c1\"\"\"\n\n    def __init__(self, alert_webhook: Optional[str] = None):\n        self.services: List[ServiceHealth] = []\n        self.alert_webhook = alert_webhook\n\n    def register(self, name: str, url: str, threshold_ms: int = 500):\n        self.services.append(ServiceHealth(name, url, threshold_ms))\n\n    async def check_service(self, service: ServiceHealth, session: aiohttp.ClientSession) -> dict:\n        start = datetime.now()\n        try:\n            async with session.get(service.url, timeout=aiohttp.ClientTimeout(total=5)) as resp:\n                elapsed_ms = (datetime.now() - start).total_seconds() * 1000\n                status = {\n                    'service': service.name,\n                    'status': 'healthy' if resp.status == 200 else 'degraded',\n                    'response_ms': round(elapsed_ms, 2),\n                    'http_status': resp.status,\n                    'timestamp': datetime.now().isoformat(),\n                    'alert': elapsed_ms > service.threshold_ms\n                }\n                service.history.append(status)\n                if status['alert']:\n                    await self._send_alert(service.name, elapsed_ms, service.threshold_ms)\n                return status\n        except Exception as e:\n            return {'service': service.name, 'status': 'down', 'error': str(e)}\n\n    async def check_all(self) -> List[dict]:\n        async with aiohttp.ClientSession() as session:\n            tasks = [self.check_service(s, session) for s in self.services]\n            return await asyncio.gather(*tasks)\n\n    async def _send_alert(self, service: str, elapsed: float, threshold: int):\n        if self.alert_webhook:\n            async with aiohttp.ClientSession() as session:\n                await session.post(self.alert_webhook, json={\n                    \"text\": f\"\u26a0\ufe0f {service} \uc751\ub2f5 \uc9c0\uc5f0: {elapsed:.0f}ms (\uc784\uacc4\uac12: {threshold}ms)\"\n                })",

  if(d==='easy') return 'badge-easy';
  if(d==='medium') return 'badge-medium';
  if(d==='intermediate') return 'badge-intermediate';
  return 'badge-advanced';
}

function buildNav(){
  const nav = document.getElementById('nav-tabs');
  const tabs = [{id:'overview',name:'📊 Overview'},...FW.map(f=>({id:f.id,name:f.name}))];
  nav.innerHTML = tabs.map(t=>`
    <button class="tab-btn ${t.id===currentTab?'active':''}" onclick="showTab('${t.id}')">${t.name}</button>
  `).join('');
}

function showTab(id){
  currentTab = id;
  currentSection = 'doc';
  buildNav();
  renderMain();
  window.scrollTo({top:0,behavior:'smooth'});
}

function renderMain(){
  const el = document.getElementById('main-content');
  if(currentTab==='overview') el.innerHTML = renderOverview();
  else {
    const fw = FW.find(f=>f.id===currentTab);
    if(fw) el.innerHTML = renderDetail(fw);
  }
}

function renderOverview(){
  const cards = FW.map(fw=>`
    <div class="fw-card" onclick="showTab('${fw.id}')">
      <div class="badge-row">
        <span class="badge badge-id">${fw.id}</span>
        <span class="badge ${diffClass(fw.difficulty)}">${fw.diffLabel}</span>
      </div>
      <h3>${fw.name}</h3>
      <div class="fullname">${fw.fullName}</div>
      <p>${fw.desc.substring(0,120)}...</p>
      <div class="strengths">${fw.strengths.map(s=>`<span class="strength-tag">${s}</span>`).join('')}</div>
      <button class="view-btn">View Details →</button>
    </div>
  `).join('');

  const rows = FW.map(fw=>`
    <tr>
      <td><strong>${fw.id}</strong></td>
      <td>${fw.fullName}</td>
      <td><span class="diff-badge ${diffClass(fw.difficulty)}">${fw.diffLabel}</span></td>
      <td>${fw.category}</td>
      <td>${fw.focus}</td>
      <td>${fw.strengths.join(', ')}</td>
    </tr>
  `).join('');

  return `
    <div class="overview-grid">${cards}</div>
    <div class="comparison-table" style="margin-top:32px">
      <h3 style="font-size:1.1rem;font-weight:700;color:#1e293b;margin-bottom:16px">📊 Framework Comparison Table</h3>
      <table>
        <thead><tr><th>ID</th><th>Full Name</th><th>Difficulty</th><th>Category</th><th>Focus</th><th>Strengths</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
  `;
}

function renderDetail(fw){
  const secTabs = [
    {id:'doc', label:'📄 Document'},
    {id:'img', label:'🖼️ Image'}
  //  {id:'code', label:'💻 Code'}
  ];

  const secTabsHtml = secTabs.map(s=>`
    <button class="sec-tab ${s.id===currentSection?'active':''}" onclick="showSection('${s.id}')">${s.label}</button>
  `).join('');

  const docSection = `
    <div class="content-section ${currentSection==='doc'?'visible':''}">
      <div class="card-grid">
        <div class="content-card">
          <h4>📝 Prompt</h4>
          <div class="prompt-box">${escHtml(fw.docPrompt)}</div>
        </div>
        <div class="content-card">
          <h4>✅ AI Output</h4>
          <div class="result-box">${escHtml(fw.docResult)}</div>
        </div>
      </div>
    </div>`;

  const imgSection = `
    <div class="content-section ${currentSection==='img'?'visible':''}">
      <div class="card-grid">
        <div class="content-card">
          <h4>🇺🇸 Image Prompt (English)</h4>
          <div class="prompt-box">${escHtml(fw.imgPromptEn)}</div>
          <div style="margin-top:12px">
          <h4 style="margin-bottom:8px">🇰🇷 Image Prompt (Korean)</h4>
          <div class="prompt-box">${escHtml(fw.imgPromptKo)}</div>
          </div>
        </div>
        <div class="content-card" style="padding:0;overflow:hidden">
          <div class="img-wrap">
            <img src="${fw.imgData?fw.imgData:'data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%22400%22 height=%22280%22><rect fill=%22%23f1f5f9%22 width=%22400%22 height=%22280%22/><text x=%22200%22 y=%22140%22 text-anchor=%22middle%22 fill=%22%2394a3b8%22>Image</text></svg>'}" 
                 alt="${fw.id} example image" loading="lazy"/>
          </div>
          <div class="img-desc">${escHtml(fw.imgDesc)}</div>
        </div>
      </div>
    </div>`;

/*  const codeSection = `
    <div class="content-section ${currentSection==='code'?'visible':''}">
      <div class="card-grid">
        <div class="content-card">
          <h4>💡 Prompt</h4>
          <div class="prompt-box">${escHtml(fw.codePrompt)}</div>
        </div>
        <div class="content-card">
          <h4>🖥️ AI Generated Code</h4>
          <div class="prompt-box">${escHtml(fw.codeResult)}</div>
        </div>
      </div>
    </div>`;
*/
  return `
    <button class="back-btn" onclick="showTab('overview')">← Back to Overview</button>
    <div class="fw-detail-header">
      <div class="top-row">
        <div class="fw-icon">${fw.id[0]}</div>
        <div>
          <h2>${fw.name}</h2>
          <div class="sub">${fw.fullName}</div>
          <div class="badges">
            <span class="badge ${diffClass(fw.difficulty)}">${fw.diffLabel}</span>
            <span class="badge" style="background:#f1f5f9;color:#475569">${fw.category}</span>
            <span class="badge" style="background:#f0fdf4;color:#166534">🎯 ${fw.focus}</span>
          </div>
        </div>
      </div>
      <div class="desc">${fw.desc}</div>
      <div class="strengths">${fw.strengths.map(s=>`<span class="strength-tag">✓ ${s}</span>`).join('')}</div>
    </div>
    <div class="section-tabs">${secTabsHtml}</div>
    ${docSection}
    ${imgSection}
    ${codeSection}
  `;
}

function showSection(id){
  currentSection = id;
  renderMain();
}

function escHtml(s){
  return String(s)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;');
}

// Init
buildNav();
renderMain();
</script>
</body>
</html>
